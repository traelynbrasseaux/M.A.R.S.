[project]
name = "mhm"
version = "0.1.0"
description = "Host tools for the machine health monitor: capture, features, anomaly models, evaluation"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.1",
    "pyserial>=3.5",
]

[project.scripts]
mhm = "mhm.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
