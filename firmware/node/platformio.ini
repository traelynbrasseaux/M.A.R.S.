[platformio]
default_envs = esp32dev

; ELEGOO ESP-WROOM-32 dev board (original ESP32, CP2102 USB-UART).
[env:esp32dev]
platform = espressif32 @ 7.1.3
board = esp32dev
framework = arduino
monitor_speed = 921600
upload_speed = 921600
build_flags =
    -D CORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<native/>
build_src_flags =
    -Wall
    -Wextra

; lib/ml built for the PC with a command line wrapper, used by the host golden tests.
[env:native]
platform = native
build_flags =
    -std=gnu++11
    -O2
build_src_filter = -<*> +<native/>
build_src_flags =
    -Wall
    -Wextra
